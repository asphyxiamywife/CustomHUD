name: release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: [self-hosted, macOS, X64]

    permissions:
      contents: write
      attestations: write
      id-token: write

    steps:
      - name: checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: configure runner tools
        shell: bash
        run: |
          printf '%s\n' /opt/local/bin /usr/local/bin >> "$GITHUB_PATH"
          git config --local gpg.program /usr/local/bin/gpg

      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
          architecture: 'x64'

      - name: setup gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: make gradle wrapper executable
        run: chmod +x ./gradlew

      - name: build
        run: ./gradlew --non-interactive clean build

      - name: locate release jar
        id: jar
        shell: bash
        run: |
          jars=()
          for jar in build/libs/*.jar; do
            [[ -f "$jar" ]] || continue
            case "$jar" in
              *-sources.jar|*-javadoc.jar|*-dev.jar) continue ;;
            esac
            jars+=("$jar")
          done
          if [[ ${#jars[@]} -ne 1 ]]; then
            printf 'Expected exactly one release jar, found %s:\n' "${#jars[@]}" >&2
            printf '%s\n' "${jars[@]}" >&2
            exit 1
          fi
          echo "path=${jars[0]}" >> "$GITHUB_OUTPUT"

      - name: attest release jar
        uses: actions/attest@v4
        with:
          subject-path: ${{ steps.jar.outputs.path }}

      - name: create release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
          RELEASE_JAR: ${{ steps.jar.outputs.path }}
        run: |
          if /opt/local/bin/gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "Release $TAG_NAME already exists; refusing to update a release asset." >&2
            exit 1
          fi

          /opt/local/bin/gh release create "$TAG_NAME" "$RELEASE_JAR" \
            --draft \
            --verify-tag \
            --title "Release $TAG_NAME" \
            --generate-notes

          /opt/local/bin/gh release edit "$TAG_NAME" --draft=false
