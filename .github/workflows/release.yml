name: release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-24.04

    permissions:
      contents: write
      attestations: write
      id-token: write

    steps:
      - name: checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'

      - name: make gradle wrapper executable
        run: chmod +x ./gradlew

      - name: build
        run: ./gradlew build

      - name: locate release jar
        id: jar
        shell: bash
        run: |
          mapfile -t jars < <(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar' | sort)
          if [[ ${#jars[@]} -ne 1 ]]; then
            printf 'Expected exactly one release jar, found %s:\n' "${#jars[@]}" >&2
            printf '%s\n' "${jars[@]}" >&2
            exit 1
          fi
          echo "path=${jars[0]}" >> "$GITHUB_OUTPUT"

      - name: attest release jar
        uses: actions/attest@v4
        with:
          subject-path: ${{ steps.jar.outputs.path }}

      - name: create release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
          RELEASE_JAR: ${{ steps.jar.outputs.path }}
        run: |
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "Release $TAG_NAME already exists; refusing to update a release asset." >&2
            exit 1
          fi

          gh release create "$TAG_NAME" "$RELEASE_JAR" \
            --draft \
            --verify-tag \
            --title "Release $TAG_NAME" \
            --generate-notes

          gh release edit "$TAG_NAME" --draft=false
