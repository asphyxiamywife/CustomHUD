plugins {
	id 'net.fabricmc.fabric-loom' version '1.19.2'
	id 'maven-publish'
	id 'java'
}

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

base {
	archivesName = project.archives_base_name
}
def snapshotBuild = providers.gradleProperty("snapshotBuild")
		.map { it.equalsIgnoreCase("true") }
		.orElse(false)
def actionsCommit = providers.environmentVariable("GITHUB_SHA")
		.map { it.take(7) }
		.orElse("")

version = snapshotBuild.get() && !actionsCommit.get().isBlank()
		? "${project.mod_version}.actions.${actionsCommit.get()}"
		: project.mod_version
group = project.maven_group

repositories {
	maven {
		url = "https://maven.terraformersmc.com/releases/"
	}
	maven { url = 'https://jitpack.io' }
	maven {
		name = "Modrinth"
		url = "https://api.modrinth.com/maven"
		content {
			includeGroup "maven.modrinth"
		}
	}
}

loom {
	accessWidenerPath = file("src/main/resources/customhud.accesswidener")
}

fabricApi {
	configureTests {
		createSourceSet = true
		modId = 'custom_hud_tests'
		enableGameTests = false
		enableClientGameTests = true
		clearRunDirectory = true
	}
}

loom.runs.clientGameTest {
	runDir = 'build/run/clientGameTest'
	programArgs '--graphicsBackend', providers.gradleProperty('testGraphicsBackend').getOrElse('default')
}

tasks.named('runClientGameTest') {
	timeout = Duration.ofMinutes(8)
}

def clientTestDirectory = layout.buildDirectory.dir('run/clientGameTest')
def clientGalleryTemplate = layout.projectDirectory.file('src/gametest/resources/gallery.html')
tasks.register('checkClientGameTest') {
	group = 'verification'
	description = 'Runs the client suite and requires completed assertions and screenshot artifacts.'
	dependsOn tasks.named('runClientGameTest')
	doLast {
		def runDirectory = clientTestDirectory.get().asFile.toPath()
		def report = runDirectory.resolve('hud-test-results.txt')
		if (!java.nio.file.Files.exists(report)) {
			throw new GradleException('Client suite did not finish; inspect the client logs and crash reports.')
		}
		def results = java.nio.file.Files.readString(report)
		if (!['PASS: mixin audit;', 'PASS: GPU inversion', 'PASS: evaluated', 'PASS: real F3'].every { results.contains(it) }) {
			throw new GradleException('Client suite did not complete all test groups:\n' + results)
		}
		def images
		try (def screenshots = java.nio.file.Files.list(runDirectory.resolve('screenshots'))) {
			images = screenshots.filter { it.fileName.toString().endsWith('.png') }.sorted().toList()
		}
		if (images.size() < 75) {
			throw new GradleException('Client suite did not produce all 75 screenshots.')
		}
		def figures = images.collect { path ->
			def name = path.fileName.toString()
			def label = name.replace('&', '&amp;').replace('<', '&lt;').replace('"', '&quot;')
			def url = new URI(null, null, 'screenshots/' + name, null).toASCIIString()
			"<figure><a href=\"${url}\"><img loading=\"lazy\" src=\"${url}\" alt=\"${label}\"></a><figcaption>${label}</figcaption></figure>"
		}.join('\n')
		def template = java.nio.file.Files.readString(clientGalleryTemplate.asFile.toPath())
		java.nio.file.Files.writeString(runDirectory.resolve('index.html'), template.replace('<!-- SCREENSHOTS -->', figures))
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

//	implementation include('com.github.oshi:oshi-core-java11:6.6.0')

	implementation ("com.terraformersmc:modmenu:${project.modmenu_version}") {
		exclude module: "fabric-api"
	}

//	implementation include("com.fifesoft:rsyntaxtextarea:3.3.3")
//	implementation include("com.formdev:flatlaf:3.1.1")

	// PSA: Some older mods, compiled on Loom 0.2.1, might have outdated Maven POMs.
	// You may need to force-disable transitiveness on them.
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	// ensure that the encoding is set to UTF-8, no matter what the system default is
	// this fixes some edge cases with special characters not displaying correctly
	// see http://yodaconditions.net/blog/fix-for-java-file-encoding-problems-with-gradle.html
	// If Javadoc is generated, this must be specified in that task too.
	it.options.encoding = "UTF-8"

	it.options.release = 25
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.base.archivesName.get()}"}
	}
}

// configure the maven publication
publishing {
	publications {
		mavenJava(MavenPublication) {
			// add all the jars that should be included when publishing to maven
			artifact(jar) {
				builtBy jar
			}
			artifact(sourcesJar) {
				builtBy sourcesJar
			}
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
